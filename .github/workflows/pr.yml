name: PR

on:
  pull_request:
    branches: [main]

jobs:
  # A provider's version in providers/manifest.json is the sole release
  # trigger (see .github/workflows/tag-provider-releases.yml and
  # CONTRIBUTING.md) — changing a provider's code without bumping its
  # version would silently merge with no release ever happening for that
  # change. This job catches that before merge.
  enforce-provider-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the PR's base commit to diff against

      - name: Require a manifest version bump for any changed provider
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)

          # providers/manifest.json may not exist at all yet in the base
          # commit (e.g. the PR that first introduces it) — treat that the
          # same as "no providers released from base", not a hard failure.
          if git cat-file -e "$BASE_SHA:providers/manifest.json" 2>/dev/null; then
            BASE_MANIFEST=$(git show "$BASE_SHA:providers/manifest.json")
          else
            BASE_MANIFEST='{"providers":{}}'
          fi

          FAILED=0
          for name in $(jq -r '.providers | keys[]' providers/manifest.json); do
            if ! grep -q "^providers/${name}/" <<< "$CHANGED_FILES"; then
              continue
            fi

            BASE_VERSION=$(jq -r --arg n "$name" '.providers[$n].version // empty' <<< "$BASE_MANIFEST")
            HEAD_VERSION=$(jq -r --arg n "$name" '.providers[$n].version' providers/manifest.json)

            if [ -z "$BASE_VERSION" ]; then
              echo "${name}: new provider, no version-bump check needed"
            elif [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
              echo "::error::providers/${name}/** changed but providers.${name}.version in providers/manifest.json is still ${HEAD_VERSION} — bump it so this change actually gets released (see CONTRIBUTING.md)"
              FAILED=1
            else
              echo "${name}: version bumped ${BASE_VERSION} -> ${HEAD_VERSION}, ok"
            fi
          done

          exit "$FAILED"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  # Cross-compiled on one Linux runner (CGO_ENABLED=0, pure Go deps) rather
  # than run on native macOS/Windows runners — cheaper and faster, and
  # produces the exact same binaries. Uploaded as build artifacts so anyone
  # can download this PR's build and try it out before it merges.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, so `git describe` below is meaningful

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          # --match restricts this to inject core's own v<version> tags —
          # without it, git describe can just as easily resolve to a
          # provider's <name>/v<version> tag when both point at (or near)
          # the same commit, producing a "/"-containing version string that
          # breaks the artifact name below.
          echo "version=$(git describe --tags --always --dirty --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build inject
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p dist/inject
          go build -ldflags "-X github.com/syringex/syringe/internal/cmd.version=${VERSION} -X github.com/syringex/syringe/internal/cmd.commit=${COMMIT} -X github.com/syringex/syringe/internal/cmd.date=${DATE}" -o "dist/inject/inject${EXT}" ./cmd/inject

      - uses: actions/upload-artifact@v7
        with:
          name: inject_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/inject/*
          if-no-files-found: error

      # Every provider declared in providers/manifest.json is built here —
      # adding a provider to the manifest is the only change needed for it
      # to start showing up in this artifact, no workflow edits required.
      # (All providers for a platform are bundled into one artifact rather
      # than one artifact each: GitHub Actions' matrix can't dynamically
      # fan out into N artifact-upload steps from a file read at runtime
      # without a second matrix-generating job, which isn't worth the extra
      # indirection for what's currently a single provider.)
      - name: Build providers
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p dist/providers
          cp providers/manifest.json dist/providers/manifest.json
          for name in $(jq -r '.providers | keys[]' providers/manifest.json); do
            pkg=$(jq -r --arg n "$name" '.providers[$n].package' providers/manifest.json)
            version=$(jq -r --arg n "$name" '.providers[$n].version' providers/manifest.json)
            go build -ldflags "-X ${pkg}.version=${version}" -o "dist/providers/inject-provider-${name}${EXT}" "$pkg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: inject-providers_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/providers/*
          if-no-files-found: error
