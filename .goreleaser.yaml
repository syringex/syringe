version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: inject
    main: ./cmd/inject
    binary: inject
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -X github.com/syringex/syringe/internal/cmd.version={{.Version}}
      - -X github.com/syringex/syringe/internal/cmd.commit={{.Commit}}
      - -X github.com/syringex/syringe/internal/cmd.date={{.Date}}
    # Deliberately no -X ...moduleDir ldflag here (unlike the local `make
    # build`): a released inject binary has no local monorepo to build
    # providers from, so `inject init` correctly refuses until Phase 6 wires
    # up downloading published provider binaries instead of `go build`.

  # Covers both the aws-sm and aws-ssm reference tags — see the package doc
  # in providers/aws: it's one provider identity (one profile/region config)
  # serving two AWS services, not two separate providers.
  - id: inject-provider-aws
    main: ./providers/aws/cmd/inject-provider-aws
    binary: inject-provider-aws
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: inject
    ids: [inject]
    name_template: "inject_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: inject-provider-aws
    ids: [inject-provider-aws]
    name_template: "inject-provider-aws_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  # No git remote or tags exist yet — this config is ready for `goreleaser
  # release` once the repo is pushed and a version tag is cut; it is not run
  # by anything automatically.
  draft: true
