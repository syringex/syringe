name: Merge

# Fires when a PR against main is closed, but the jobs below only actually
# run if it was merged (not just closed) — see the `if` on the test job.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  # Same cross-compiled matrix as the PR workflow (see its comment), plus a
  # sha256 checksum file alongside each platform's binaries. `needs: test`
  # means this — and its `if` above — is skipped automatically whenever the
  # PR was closed without merging.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, so `git describe` below is meaningful

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          # --match restricts this to inject core's own v<version> tags —
          # without it, git describe can just as easily resolve to a
          # provider's <name>/v<version> tag when both point at (or near)
          # the same commit, producing a "/"-containing version string that
          # breaks the artifact name below.
          echo "version=$(git describe --tags --always --dirty --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build inject
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p dist/inject
          go build -ldflags "-X github.com/syringex/syringe/internal/cmd.version=${VERSION} -X github.com/syringex/syringe/internal/cmd.commit=${COMMIT} -X github.com/syringex/syringe/internal/cmd.date=${DATE}" -o "dist/inject/inject${EXT}" ./cmd/inject

      - name: Checksum inject
        working-directory: dist/inject
        run: sha256sum * > checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: inject_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/inject/*
          if-no-files-found: error

      # Every provider declared in providers/manifest.json is built here —
      # adding a provider to the manifest is the only change needed for it
      # to start showing up in this artifact, no workflow edits required.
      # (All providers for a platform are bundled into one artifact rather
      # than one artifact each: GitHub Actions' matrix can't dynamically
      # fan out into N artifact-upload steps from a file read at runtime
      # without a second matrix-generating job, which isn't worth the extra
      # indirection for what's currently a single provider.)
      - name: Build providers
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p dist/providers
          cp providers/manifest.json dist/providers/manifest.json
          for name in $(jq -r '.providers | keys[]' providers/manifest.json); do
            pkg=$(jq -r --arg n "$name" '.providers[$n].package' providers/manifest.json)
            version=$(jq -r --arg n "$name" '.providers[$n].version' providers/manifest.json)
            go build -ldflags "-X ${pkg}.version=${version}" -o "dist/providers/inject-provider-${name}${EXT}" "$pkg"
          done

      - name: Checksum providers
        working-directory: dist/providers
        run: sha256sum inject-provider-* > checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: inject-providers_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/providers/*
          if-no-files-found: error
