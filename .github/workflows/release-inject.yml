name: Release inject

# inject core's own release train — separate from a provider's (see
# release-provider.yml). Triggered by pushing a plain v<version> tag
# (unprefixed, unlike a provider's <name>/v<version>), which a human
# creates and pushes directly; there's no auto-tagging step for inject
# core the way providers/manifest.json drives one for providers, since
# there's no equivalent single source-of-truth file to watch for a version
# bump.
#
# Hand-rolled (no goreleaser): the only things a release needs beyond what
# pr.yml/merge.yml already hand-roll for the cross-compile loop are
# archiving, checksumming, and creating the GitHub Release -- a few lines
# of shell, not worth a dependency that has twice turned out to gate real
# features (a monorepo tag-prefix feature, then macOS notarization) behind
# a paid Pro tier we don't have.
on:
  push:
    tags: ['v[0-9]*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, so version/commit below are meaningful

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build, archive, and checksum every platform
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p dist
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              EXT=""
              FORMAT="tar.gz"
              if [ "$goos" = "windows" ]; then EXT=".exe"; FORMAT="zip"; fi

              workdir="$(mktemp -d)"
              GOOS="$goos" GOARCH="$goarch" go build \
                -ldflags "-X github.com/syringex/syringe/internal/cmd.version=${VERSION} -X github.com/syringex/syringe/internal/cmd.commit=${COMMIT} -X github.com/syringex/syringe/internal/cmd.date=${DATE}" \
                -o "${workdir}/inject${EXT}" ./cmd/inject

              name="inject_${VERSION}_${goos}_${goarch}"
              if [ "$FORMAT" = "zip" ]; then
                (cd "$workdir" && zip -q "${name}.zip" "inject${EXT}")
                mv "${workdir}/${name}.zip" "dist/"
              else
                tar -C "$workdir" -czf "dist/${name}.tar.gz" "inject${EXT}"
              fi
              rm -rf "$workdir"
            done
          done

          (cd dist && shasum -a 256 -- * > checksums.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        id: build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
