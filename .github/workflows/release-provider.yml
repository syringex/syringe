name: Release provider

# Providers are released independently of inject core, under their own tag
# namespace: <name>/v<version> (e.g. aws/v0.1.0) — see CONTRIBUTING.md. This
# glob matches that shape but not inject core's own v<version> tags (which
# have no "/").
#
# Works for any provider declared in providers/manifest.json generically:
# adding a provider means adding a manifest entry, nothing here.
#
# Two triggers, for two different tag-creation paths:
#   - push: tags — a tag pushed by a real, human-authenticated git push
#     (e.g. a manual re-release). GitHub Actions events fire normally for
#     these.
#   - workflow_dispatch: tag-provider-releases.yml creates and pushes a
#     provider's tag using the default GITHUB_TOKEN, and GitHub deliberately
#     does not fire push-triggered workflows for a GITHUB_TOKEN-authored
#     push (an anti-recursion guard) — so that workflow explicitly
#     dispatches this one instead, passing the tag it just created.
on:
  push:
    tags: ['*/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Provider tag to release, e.g. aws/v0.1.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }} # workflow_dispatch checks out the default branch otherwise
          fetch-depth: 0 # full history + tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build, archive, and checksum every platform
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="${TAG%%/*}"
          VERSION="${TAG#"${NAME}/v"}"

          PKG=$(jq -r --arg n "$NAME" '.providers[$n].package // empty' providers/manifest.json)
          if [ -z "$PKG" ]; then
            echo "::error::no providers.${NAME} entry in providers/manifest.json for tag ${TAG}"
            exit 1
          fi

          mkdir -p dist
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              EXT=""
              FORMAT="tar.gz"
              if [ "$goos" = "windows" ]; then EXT=".exe"; FORMAT="zip"; fi

              binname="inject-provider-${NAME}"
              workdir="$(mktemp -d)"
              GOOS="$goos" GOARCH="$goarch" go build \
                -ldflags "-X ${PKG}.version=${VERSION}" \
                -o "${workdir}/${binname}${EXT}" "$PKG"

              archive="${binname}_v${VERSION}_${goos}_${goarch}"
              if [ "$FORMAT" = "zip" ]; then
                (cd "$workdir" && zip -q "${archive}.zip" "${binname}${EXT}")
                mv "${workdir}/${archive}.zip" "dist/"
              else
                tar -C "$workdir" -czf "dist/${archive}.tar.gz" "${binname}${EXT}"
              fi
              rm -rf "$workdir"
            done
          done

          (cd dist && shasum -a 256 -- * > checksums.txt)
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        id: build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "${TAG}" dist/* \
            --title "${TAG}" \
            --generate-notes
