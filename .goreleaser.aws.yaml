version: 2

# This provider's release train is entirely independent of inject core's
# own v<version> tags/releases and of every other provider's — tags live
# under aws/vX.Y.Z (see CONTRIBUTING.md). Scoping a goreleaser config to a
# tag prefix and stripping it from {{.Version}} automatically is a
# GoReleaser Pro feature (`monorepo:`); without Pro, .github/workflows/
# release-provider.yml computes the prefix-stripped version itself and
# passes it in as PROVIDER_VERSION, and every template below reads that
# instead of {{.Version}} (which would still contain "aws/" and break
# these filenames). It also pins GORELEASER_CURRENT_TAG so goreleaser
# doesn't have to guess between this tag and inject core's, in case both
# ever point at the same commit.

before:
  hooks:
    - go mod tidy

builds:
  # Covers both the aws-sm and aws-ssm reference tags — see the package doc
  # in providers/aws: it's one provider identity (one profile/region
  # config) serving two AWS services, not two separate providers.
  - id: inject-provider-aws
    main: ./providers/aws/cmd/inject-provider-aws
    binary: inject-provider-aws
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -X github.com/syringex/syringe/providers/aws/cmd/inject-provider-aws.version={{.Env.PROVIDER_VERSION}}

archives:
  - id: inject-provider-aws
    ids: [inject-provider-aws]
    name_template: "inject-provider-aws_v{{ .Env.PROVIDER_VERSION }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  name_template: "aws/v{{ .Env.PROVIDER_VERSION }}"
