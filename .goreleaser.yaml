version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: inject
    main: ./cmd/inject
    binary: inject
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -X github.com/syringex/syringe/internal/cmd.version={{.Version}}
      - -X github.com/syringex/syringe/internal/cmd.commit={{.Commit}}
      - -X github.com/syringex/syringe/internal/cmd.date={{.Date}}
    # Deliberately no -X ...moduleDir ldflag here (unlike the local `make
    # build`): a released inject binary has no local monorepo to build
    # providers from, so `inject init` downloads a provider's own release
    # instead — see .goreleaser.aws.yaml and internal/providerdownload.

# Providers are NOT built here: each has its own goreleaser config
# (.goreleaser.<name>.yaml) and release train, tagged independently of
# inject core (<name>/v<version> rather than v<version>) — see
# .goreleaser.aws.yaml and .github/workflows/release-provider.yml.

archives:
  - id: inject
    ids: [inject]
    name_template: "inject_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  # Runs via .github/workflows/release-inject.yml whenever a v<version> tag
  # is pushed (inject core's own tag scheme — unprefixed, unlike a
  # provider's <name>/v<version>, so no monorepo-style version stripping is
  # needed here).
