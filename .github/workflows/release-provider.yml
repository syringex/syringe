name: Release provider

# Providers are released independently of inject core, under their own tag
# namespace: <name>/v<version> (e.g. aws/v0.1.0) — see CONTRIBUTING.md. This
# glob matches that shape but not inject core's own v<version> tags (which
# have no "/").
#
# Two triggers, for two different tag-creation paths:
#   - push: tags — a tag pushed by a real, human-authenticated git push
#     (e.g. a manual re-release). GitHub Actions events fire normally for
#     these.
#   - workflow_dispatch: tag-provider-releases.yml creates and pushes a
#     provider's tag using the default GITHUB_TOKEN, and GitHub deliberately
#     does not fire push-triggered workflows for a GITHUB_TOKEN-authored
#     push (an anti-recursion guard) — so that workflow explicitly
#     dispatches this one instead, passing the tag it just created.
on:
  push:
    tags: ['*/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Provider tag to release, e.g. aws/v0.1.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser needs this to create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }} # workflow_dispatch checks out the default branch otherwise
          fetch-depth: 0 # full history + tags, goreleaser needs both

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine provider name, version, and config from tag
        id: provider
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="${TAG%%/*}"
          CONFIG=".goreleaser.${NAME}.yaml"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::no $CONFIG for provider '$NAME' (tag $TAG) — see CONTRIBUTING.md for adding a new provider's release config"
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "config=${CONFIG}" >> "$GITHUB_OUTPUT"

          # goreleaser's own {{.Version}} is derived from the tag with only
          # a single leading "v" stripped — for a slash-namespaced tag like
          # "aws/v0.1.0" that leaves the "/" in place, which breaks any
          # filename template that references it (this is what "GoReleaser
          # Pro"'s monorepo/tag_prefix feature exists to handle; we don't
          # have that, so .goreleaser.<name>.yaml uses .Env.PROVIDER_VERSION
          # instead of .Version everywhere a filename is built).
          echo "PROVIDER_VERSION=${TAG#"${NAME}/v"}" >> "$GITHUB_ENV"

          # GORELEASER_CURRENT_TAG pins which tag goreleaser treats as "the"
          # release tag — without it, goreleaser's own tag auto-detection
          # can just as easily land on inject core's plain v<version> tag
          # when both point at/near the same commit (the same ambiguity
          # --match 'v[0-9]*' fixes for our own git describe calls).
          echo "GORELEASER_CURRENT_TAG=${TAG}" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          # --skip=validate: goreleaser's validate pipe hard-fails release
          # (non-snapshot) mode unless the current tag parses as bare
          # semver on its own — "aws/v0.1.0" never will, by design (see
          # above). It also covers the "git is dirty" check, which is moot
          # in a fresh CI checkout. Verified locally with a real goreleaser
          # binary that both checks are the only things --skip=validate
          # disables and that the rest of the pipeline (build/archive/
          # checksum) runs unaffected.
          args: release --clean --skip=validate -f ${{ steps.provider.outputs.config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
